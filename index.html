<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08091a" />
    <title>It’s My Turn… Check! — turn-based chess survival</title>
    <link rel="stylesheet" href="style.css?v=mobile-layout" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      #app {
        position: fixed;
        inset: 0;
        width: 100vw;
        max-width: none;
        height: 100dvh;
      }
      .overlay {
        width: 100%;
        justify-content: center;
      }
      .panel {
        position: fixed;
        left: 50vw;
        top: 50dvh;
        width: 100%;
        max-width: 630px;
        transform: translate(-50%, -50%);
      }
      .upgrade {
        max-width: 900px;
      }
      .choices b {
        margin-left: 0;
      }
      @media (max-width: 560px) {
        body {
          max-width: 100%;
          overflow-x: hidden;
        }
        .hud {
          width: 100%;
          grid-template-columns: minmax(0, 1fr) auto;
          row-gap: 10px;
          padding-left: max(18px, env(safe-area-inset-left));
          padding-right: max(18px, env(safe-area-inset-right));
        }
        .brand {
          min-width: 0;
        }
        .turn {
          grid-column: 1/-1;
          grid-row: 2;
          justify-self: center;
        }
        .hint {
          top: 122px;
          line-height: 1.4;
        }
        .meter {
          bottom: 20px;
        }
      }
      .devbar {
        position: absolute;
        z-index: 4;
        left: 18px;
        bottom: 18px;
        display: flex;
        gap: 6px;
      }
      .devbar.hidden {
        display: none;
      }
      .devbar button {
        margin: 0;
        padding: 8px 10px;
        border-color: #ffd166;
        background: #191b34;
        color: #ffd166;
        box-shadow: none;
        font:
          500 10px "DM Mono",
          monospace;
      }
      .dev-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin: 20px auto 0;
        color: #ffd166;
        font:
          500 11px "DM Mono",
          monospace;
        letter-spacing: 0.1em;
      }
      .dev-toggle input {
        accent-color: #ffd166;
      }
    </style>
  </head>
  <style>
    .devbar {
      flex-wrap: wrap;
      max-width: min(96vw, 560px);
    }
    .dev-pick {
      max-width: 760px;
    }
    .dev-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }
    .dev-options button {
      min-height: 96px;
      margin: 0;
      padding: 10px;
      color: #eafaff;
      background: #141a39;
      border-color: #ffffff33;
      box-shadow: none;
    }
    .dev-options button:hover {
      border-color: #53f0e4;
      box-shadow: 0 0 20px #53f0e433;
    }
    .dev-options b,
    .dev-options strong,
    .dev-options span {
      display: block;
    }
    .dev-options b {
      color: #ffd166;
      font-size: 31px;
    }
    .dev-options strong {
      margin: 5px 0;
      color: #f45cf4;
      font:
        500 12px "DM Mono",
        monospace;
    }
    .dev-options span {
      color: #adb3d0;
      font-size: 10px;
      line-height: 1.3;
    }
    .dev-options button:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .dev-close {
      margin-top: 14px;
      padding: 10px 18px;
      background: #191b34;
      color: #c6c9dc;
      border-color: #ffffff44;
      box-shadow: none;
    }
    @media (max-width: 560px) {
      .devbar {
        left: 10px;
        bottom: 10px;
        gap: 4px;
      }
      .devbar button {
        padding: 7px 8px;
        font-size: 9px;
      }
      .dev-options {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .dev-options button {
        min-height: 82px;
      }
    }
  </style>
  <style>
    .sound-control {
      position: absolute;
      z-index: 6;
      right: 18px;
      bottom: 18px;
      font:
        500 10px "DM Mono",
        monospace;
      color: #c6c9dc;
    }
    .sound-control button {
      margin: 0;
      padding: 8px 11px;
      color: #53f0e4;
      background: #191b34;
      border-color: #53f0e4;
      box-shadow: none;
      font-size: 16px;
    }
    .sound-control label {
      position: absolute;
      right: 0;
      bottom: 43px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 205px;
      padding: 11px 12px;
      background: #14162ddd;
      border: 1px solid #53f0e477;
      box-shadow: 0 0 18px #53f0e422;
    }
    .sound-control .hidden {
      display: none;
    }
    .sound-control input {
      width: 100px;
      accent-color: #53f0e4;
    }
    .sound-control output {
      color: #53f0e4;
      width: 30px;
      text-align: right;
    }
    @media (max-width: 560px) {
      .sound-control {
        right: 10px;
        bottom: 10px;
      }
      .sound-control label {
        bottom: 40px;
      }
    }
  </style>
  <style>
    .brand,
    .turn,
    .hint {
      display: none;
    }
    .hud {
      display: flex;
      justify-content: flex-end;
    }
    .stats {
      justify-self: auto;
    }
    #app,
    #app * {
      font-family: "Gowun Batang", serif !important;
    }
    #startScreen {
      display: block;
      padding: 0;
      background: url("assets/its-my-turn-check-thumbnail.png") center / cover;
      backdrop-filter: none;
    }
    #startScreen .start-button {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;
      min-width: min(76vw, 360px);
      margin: 0;
      transform: translate(-50%, -50%);
      font-size: clamp(22px, 4vw, 34px);
    }
    #startScreen .start-button:hover,
    #startScreen .start-button:active {
      transform: translate(-50%, -50%) scale(1.035);
    }
    #startScreen .start-dev {
      position: absolute;
      z-index: 2;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: max(18px, env(safe-area-inset-left));
      justify-content: flex-start;
      margin: 0;
      padding: 7px 9px;
      border: 1px solid #ffd16688;
      background: #090a1888;
      color: #ffd166;
      font-size: 9px;
      backdrop-filter: blur(3px);
    }
    #comboToast {
      position: absolute;
      z-index: 7;
      top: max(76px, calc(env(safe-area-inset-top) + 54px));
      left: 50%;
      transform: translate(-50%, -18px) scale(0.72);
      opacity: 0;
      color: #fff;
      font: 700 clamp(28px, 5vw, 48px) / 1 "Gowun Batang", serif;
      letter-spacing: -0.04em;
      text-shadow:
        0 0 14px #53f0e4,
        0 0 32px #f45cf4;
      pointer-events: none;
    }
    #comboToast.show {
      animation: combo-pop 0.95s ease-out forwards;
    }
    .intro h1 {
      font-size: clamp(36px, 8vw, 72px);
      line-height: 0.94;
    }
    @keyframes combo-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -18px) scale(0.72);
      }
      18% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1.16);
      }
      42% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -14px) scale(0.94);
      }
    }
    @media (max-width: 560px) {
      #comboToast {
        top: max(86px, calc(env(safe-area-inset-top) + 66px));
        font-size: 28px;
      }
      .hud {
        padding-top: max(16px, env(safe-area-inset-top));
      }
    }
  </style>
  <body>
    <main id="app">
      <canvas id="game"></canvas>
      <header class="hud">
        <div class="brand">
          <span>IT’S MY TURN…</span> CHECK!<small>TURN-BASED CHESS SURVIVAL</small>
        </div>
        <div class="turn">
          <span id="phaseLabel">ENEMY BEAT</span
          ><strong id="beatText">READY</strong>
        </div>
        <div class="stats">
          <span>WAVE <b id="hp">0</b></span
          ><span>XP <b id="xp">0 / 3</b></span>
        </div>
      </header>
      <div id="comboToast" aria-live="polite"></div>
      <div class="hint" id="hint">
        적 말이 움직인 직후, 빛나는 칸 하나를 선택하세요.
      </div>
      <div class="meter"><i id="meterFill"></i></div>
      <div class="devbar hidden" id="devBar">
        <button id="devXp">[1] +XP</button
        ><button id="devPawn">[2] +PAWN</button
        ><button id="devBeat">[3] BEAT</button
        ><button id="devSpeed">[4] ×2 SPEED</button
        ><button id="devPiece">[5] PIECE</button
        ><button id="devTrait">[6] TRAIT</button>
      </div>
      <div class="sound-control">
        <button id="soundToggle" aria-label="사운드 설정">♫</button
        ><label id="soundPanel" class="hidden"
          >VOLUME
          <input
            id="volumeRange"
            type="range"
            min="0"
            max="100"
            value="100"
          /><output id="volumeValue">100%</output></label
        >
      </div>
      <section class="overlay" id="startScreen">
        <label class="dev-toggle start-dev"
          ><input id="devToggle" type="checkbox" />DEV MODE · TEST TOOLS</label
        ><button class="start-button" id="startButton">IT'S MY TURN <b>↗</b></button>
      </section>
      <section class="overlay hidden" id="upgradeScreen">
        <div class="panel upgrade">
          <p class="eyebrow" id="upgradeEyebrow">PROMOTION AVAILABLE</p>
          <h2 id="upgradeTitle">어떤 말이 될까요?</h2>
          <div class="choices">
            <button class="upgrade-choice" data-choice="0">
              <b>♞</b><strong>KNIGHT</strong
              ><span>L자 이동 · 착지 충격파</span></button
            ><button class="upgrade-choice" data-choice="1">
              <b>♜</b><strong>ROOK</strong
              ><span>직선 3칸 · 관통 섬광</span></button
            ><button class="upgrade-choice" data-choice="2">
              <b>♝</b><strong>BISHOP</strong><span>대각선 3칸 · 대각 폭발</span>
            </button>
          </div>
        </div>
      </section>
      <section class="overlay hidden" id="devPickScreen">
        <div class="panel upgrade dev-pick">
          <p class="eyebrow">DEV MODE · DIRECT SELECT</p>
          <h2 id="devPickTitle">기물을 선택하세요</h2>
          <div class="dev-options" id="devPickOptions"></div>
          <button class="dev-close" id="devPickClose">닫기</button>
        </div>
      </section>
      <section class="overlay hidden" id="gameOverScreen">
        <div class="panel intro">
          <p class="eyebrow">CHECKMATE</p>
          <h2>THE BOARD REMEMBERS.</h2>
          <p id="resultText"></p>
          <button id="restartButton">다시 도전 <b>↻</b></button>
        </div>
      </section>
    </main>
    <script src="game.js?v=rainbow-traits-expansion"></script>
  </body>
</html>
