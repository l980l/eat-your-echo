<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070713" />
    <title>8초 전의 나</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game" aria-label="8초 전의 나 퍼즐 게임"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <header class="hud">
        <div class="brand"><span>PAST SELF PUZZLE</span><strong>8초 전의 나</strong></div>
        <div class="stage"><span id="stage-label">STAGE 01</span><strong id="stage-name">첫 번째 기록</strong></div>
        <div class="progress"><span id="crystal-count">0 / 1</span><small>MEMORIES</small></div>
      </header>
      <div id="phase" class="phase"><span id="phase-label">RECORD PATH</span><strong id="phase-time">04.0</strong><i><b id="phase-fill"></b></i></div>
      <p id="instruction" class="instruction"></p>
      <section id="start-screen" class="overlay show">
        <div class="panel">
          <p class="eyebrow">A PUZZLE FOR YOUR PAST SELF</p>
          <h1>4초 뒤의 나에게<br /><em>길을 가르쳐 주세요.</em></h1>
          <div class="steps"><div><b>01</b><span>청록색 나를 움직여<br />길을 기록하세요</span></div><div><b>02</b><span>보라색 잔상이<br />그 길을 재생합니다</span></div><div><b>03</b><span>잔상이 기억 조각을<br />모으면 성공</span></div></div>
          <button id="start-button" class="primary">첫 기록 시작 <span>↗</span></button>
          <p class="control-note">마우스 또는 손가락으로 이동 · 충돌해도 실패하지 않아요</p>
        </div>
      </section>
      <section id="result-screen" class="overlay">
        <div class="panel result"><p class="eyebrow">MEMORY RESTORED</p><h2>모든 길을<br /><em>기억했습니다.</em></h2><p>과거의 나는 이제 당신이 남긴 모든 길을 따라갈 수 있어요.</p><button id="restart-button" class="primary">처음부터 다시 <span>↻</span></button></div>
      </section>
      <button id="retry-button" class="retry" hidden>↻ 다시 기록</button>
    </main>
    <script src="game.js"></script>
  </body>
</html>
