<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#08091a"><title>CHECKBEAT — rhythm chess survival</title><link rel="stylesheet" href="style.css?v=mobile-layout"><style>@media(max-width:560px){body,#app{max-width:100%;overflow-x:hidden}.hud{width:100%;grid-template-columns:minmax(0,1fr) auto;row-gap:10px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}.brand{min-width:0}.turn{grid-column:1/-1;grid-row:2;justify-self:center}.hint{top:122px;line-height:1.4}.meter{bottom:20px}}.devbar{position:absolute;z-index:4;left:18px;bottom:18px;display:flex;gap:6px}.devbar.hidden{display:none}.devbar button{margin:0;padding:8px 10px;border-color:#ffd166;background:#191b34;color:#ffd166;box-shadow:none;font:500 10px 'DM Mono',monospace}.dev-toggle{display:flex;align-items:center;justify-content:center;gap:8px;margin:20px auto 0;color:#ffd166;font:500 11px 'DM Mono',monospace;letter-spacing:.1em}.dev-toggle input{accent-color:#ffd166}</style></head>
<body><main id="app"><canvas id="game"></canvas>
<header class="hud"><div class="brand"><span>CHECK</span>BEAT<small>RHYTHM CHESS SURVIVAL</small></div><div class="turn"><span id="phaseLabel">ENEMY BEAT</span><strong id="beatText">READY</strong></div><div class="stats"><span>WAVE <b id="hp">0</b></span><span>XP <b id="xp">0 / 3</b></span></div></header>
<div class="hint" id="hint">적 말이 움직인 직후, 빛나는 칸 하나를 선택하세요.</div><div class="meter"><i id="meterFill"></i></div><div class="devbar hidden" id="devBar"><button id="devXp">[1] +XP</button><button id="devPawn">[2] +PAWN</button><button id="devBeat">[3] BEAT</button><button id="devSpeed">[4] ×2 SPEED</button></div>
<section class="overlay" id="startScreen"><div class="panel intro"><p class="eyebrow">ONE MOVE · ONE BEAT · SURVIVE</p><h1>CHECK<span>BEAT</span></h1><p>적 말들은 박자마다 함께 다가옵니다.<br>당신은 한 박자에 단 한 번, 체스 말처럼 움직입니다.</p><p class="rules">적을 잡아 XP를 모으고, 더 강한 말로 <em>승진</em>하세요.<br>마지막 칸은 없습니다.</p><label class="dev-toggle"><input id="devToggle" type="checkbox">DEV MODE · TEST TOOLS</label><button id="startButton">게임 시작 <b>↗</b></button></div></section>
<section class="overlay hidden" id="upgradeScreen"><div class="panel upgrade"><p class="eyebrow">PROMOTION AVAILABLE</p><h2>어떤 말이 될까요?</h2><div class="choices"><button data-piece="knight"><b>♞</b><strong>KNIGHT</strong><span>L자 이동 · 착지 충격파</span></button><button data-piece="rook"><b>♜</b><strong>ROOK</strong><span>직선 3칸 · 관통 섬광</span></button><button data-piece="bishop"><b>♝</b><strong>BISHOP</strong><span>대각선 3칸 · 대각 폭발</span></button></div></div></section>
<section class="overlay hidden" id="gameOverScreen"><div class="panel intro"><p class="eyebrow">CHECKMATE</p><h2>THE BOARD REMEMBERS.</h2><p id="resultText"></p><button id="restartButton">다시 도전 <b>↻</b></button></div></section>
</main><script src="game.js?v=quick-beat"></script></body></html>
